seed = 4
batch_size = 1024
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
amp = true

[data]
cache = true
path = "data/microsoft"
num_policy = "noisy-quantile"

[optimizer]
type = "AdamW"
lr = 3.695673521432129e-05
weight_decay = 0.0
loss = "static_weights"

[model]
arch_type = "plain"

[model.backbone]
type = "MLP"
n_blocks = 1
d_block = 416
dropout = 0.47858378447256017

[model.num_embeddings]
type = "PeriodicEmbeddings"
n_frequencies = 88
d_embedding = 32
frequency_init_scale = 0.01935467734980898
lite = false
