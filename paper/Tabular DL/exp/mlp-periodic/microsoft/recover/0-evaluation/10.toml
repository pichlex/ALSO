seed = 10
batch_size = 1024
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
amp = true

[data]
cache = true
path = "data/microsoft"
num_policy = "noisy-quantile"

[optimizer]
type = "AdamW"
loss = "importance"
loss_tau = 0.012640008057011931
lr = 9.668011001971411e-05
weight_decay = 0.05271921556741914

[model]
arch_type = "plain"

[model.backbone]
type = "MLP"
n_blocks = 2
d_block = 944
dropout = 0.028019882816423675

[model.num_embeddings]
type = "PeriodicEmbeddings"
n_frequencies = 64
d_embedding = 16
frequency_init_scale = 0.015312030825058434
lite = false
