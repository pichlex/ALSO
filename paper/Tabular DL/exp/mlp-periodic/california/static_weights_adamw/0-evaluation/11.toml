seed = 11
batch_size = 256
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
amp = true

[data]
cache = true
path = "data/california"
num_policy = "noisy-quantile"

[optimizer]
type = "AdamW"
lr = 0.00028874477904207793
weight_decay = 0.0
loss = "static_weights"

[model]
arch_type = "plain"

[model.backbone]
type = "MLP"
n_blocks = 5
d_block = 512
dropout = 0.40316326751509574

[model.num_embeddings]
type = "PeriodicEmbeddings"
n_frequencies = 60
d_embedding = 28
frequency_init_scale = 0.7863713858204002
lite = false
