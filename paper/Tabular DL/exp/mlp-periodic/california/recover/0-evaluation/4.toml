seed = 4
batch_size = 256
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
amp = true

[data]
cache = true
path = "data/california"
num_policy = "noisy-quantile"

[optimizer]
type = "AdamW"
loss = "importance"
loss_tau = 0.00046298300744596066
lr = 0.0007445422720957512
weight_decay = 0.002646062764098961

[model]
arch_type = "plain"

[model.backbone]
type = "MLP"
n_blocks = 3
d_block = 912
dropout = 0.4246919268426324

[model.num_embeddings]
type = "PeriodicEmbeddings"
n_frequencies = 48
d_embedding = 28
frequency_init_scale = 2.2629581535208305
lite = false
