[model]
arch_type = "plain"

[model.backbone]
type = "MLP"
n_blocks = 1
d_block = 864
dropout = 0.2512021981574084

[model.num_embeddings]
type = "PeriodicEmbeddings"
n_frequencies = 20
d_embedding = 16
frequency_init_scale = 1.433630090185167
lite = false
