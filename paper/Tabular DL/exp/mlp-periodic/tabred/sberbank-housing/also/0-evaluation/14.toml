[model]
arch_type = "plain"

[model.backbone]
type = "MLP"
n_blocks = 1
d_block = 224
dropout = 0.0

[model.num_embeddings]
type = "PeriodicEmbeddings"
n_frequencies = 48
d_embedding = 20
frequency_init_scale = 0.22102681630785403
lite = false
