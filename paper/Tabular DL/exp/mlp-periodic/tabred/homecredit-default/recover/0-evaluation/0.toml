seed = 0
batch_size = 1024
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
amp = true

[data]
cache = true
path = "data/homecredit-default"
num_policy = "noisy-quantile"
cat_policy = "ordinal"

[optimizer]
type = "AdamW"
loss = "importance"
loss_tau = 0.1475696426560795
lr = 5.720462924086608e-05
weight_decay = 0.0

[model]
arch_type = "plain"

[model.backbone]
type = "MLP"
n_blocks = 2
d_block = 880
dropout = 0.4507582981814703

[model.num_embeddings]
type = "PeriodicEmbeddings"
n_frequencies = 24
d_embedding = 16
frequency_init_scale = 0.07121059661682808
lite = false
