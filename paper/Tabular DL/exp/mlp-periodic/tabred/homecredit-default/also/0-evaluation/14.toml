[model]
arch_type = "plain"

[model.backbone]
type = "MLP"
n_blocks = 1
d_block = 896
dropout = 0.0

[model.num_embeddings]
type = "PeriodicEmbeddings"
n_frequencies = 72
d_embedding = 16
frequency_init_scale = 0.025081246224449173
lite = false
