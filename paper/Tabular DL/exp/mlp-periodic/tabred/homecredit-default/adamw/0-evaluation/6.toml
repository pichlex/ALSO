seed = 6
batch_size = 1024
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
amp = true

[data]
cache = true
path = "data/homecredit-default"
num_policy = "noisy-quantile"
cat_policy = "ordinal"

[optimizer]
type = "AdamW"
lr = 4.761792226899932e-05
weight_decay = 0.0

[model]
arch_type = "plain"

[model.backbone]
type = "MLP"
n_blocks = 1
d_block = 736
dropout = 0.2634079333451912

[model.num_embeddings]
type = "PeriodicEmbeddings"
n_frequencies = 88
d_embedding = 24
frequency_init_scale = 0.0356168481163062
lite = false
