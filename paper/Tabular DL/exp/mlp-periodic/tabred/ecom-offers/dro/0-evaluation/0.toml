seed = 0
batch_size = 1024
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
amp = true

[data]
cache = true
path = "data/ecom-offers"
num_policy = "noisy-quantile"

[optimizer]
type = "AdamW"
lr = 7.815537232834456e-05
weight_decay = 0.0
loss = "dro"
loss_penalty = "kl"
loss_shift_cost = 0.19936851589420324
loss_ndraws = 0.025883701695949453

[model]
arch_type = "plain"

[model.backbone]
type = "MLP"
n_blocks = 1
d_block = 416
dropout = 0.0

[model.num_embeddings]
type = "PeriodicEmbeddings"
n_frequencies = 80
d_embedding = 16
frequency_init_scale = 0.014348968879317239
lite = false
