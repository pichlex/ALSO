seed = 4
batch_size = 1024
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
amp = true

[data]
cache = true
path = "data/cooking-time"
cat_policy = "ordinal"

[optimizer]
type = "AdamW"
loss = "importance"
loss_tau = 0.1842680405155288
lr = 9.79622119634856e-05
weight_decay = 0.015053750104651507

[model]
arch_type = "plain"

[model.backbone]
type = "MLP"
n_blocks = 4
d_block = 832
dropout = 0.0

[model.num_embeddings]
type = "PeriodicEmbeddings"
n_frequencies = 96
d_embedding = 32
frequency_init_scale = 0.018020396333937417
lite = false
