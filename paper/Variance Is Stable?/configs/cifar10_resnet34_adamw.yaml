dataset: cifar10
model: resnet34
optimizer: adamw
seed: 18
batch_size: 64
epochs: 40
lr: 0.0005
betas: [0.9, 0.999]
weight_decay: 0.0005
scheduler: cosine
scheduler_T_max: 40
scheduler_eta_min: 0.00001
num_workers: 2
transform_mode: all
device: auto
output_dir: paper/Variance Is Stable?/runs/resnet34_adamw/
metric_microbatch_size: 16
eval_every: 1
persistent_workers: true
prefetch_factor: 2
non_blocking_transfers: true
cudnn_benchmark: true
profile_timing: true
